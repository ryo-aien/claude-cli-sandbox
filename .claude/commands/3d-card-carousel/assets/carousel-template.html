<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Card Carousel (Buttons + Infinite Loop)</title>
  <style>
    :root{
      --card-w: 240px;
      --card-h: 320px;
      --duration: 900ms;
      --ease: cubic-bezier(.25,.8,.25,1);
      --radius: 420px; /* 奥行き */
    }

    *{ box-sizing:border-box; }
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      background: radial-gradient(1000px 600px at 50% 30%, #15162a 0%, #06060d 60%, #000 100%);
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color:#fff;
    }

    .wrap{
      width:min(92vw, 520px);
      display:grid;
      gap:18px;
      justify-items:center;
    }

    .stage{
      width: var(--card-w);
      height: var(--card-h);
      position: relative;
      perspective: 1200px;
      filter: drop-shadow(0 30px 55px rgba(0,0,0,.55));
      user-select: none;
    }

    .carousel{
      width:100%;
      height:100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform var(--duration) var(--ease);
      will-change: transform;
    }

    .card{
      position:absolute;
      inset:0;
      border-radius: 18px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.12);
      backdrop-filter: blur(8px);
      transform-style: preserve-3d;
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    .card::before{
      content:"";
      position:absolute;
      inset:-60% -60% auto -60%;
      height: 70%;
      background: radial-gradient(circle at 30% 30%, rgba(120,140,255,.35), transparent 60%);
      transform: rotate(12deg);
      pointer-events:none;
    }

    .avatar{
      width:78px;height:78px;border-radius:999px;
      border: 3px solid rgba(120,140,255,.7);
      box-shadow: 0 10px 25px rgba(0,0,0,.45);
      background:#222;
      overflow:hidden;
      display:grid; place-items:center;
      margin-bottom:10px;
    }
    .avatar img{ width:100%; height:100%; object-fit:cover; }
    .name{ font-weight:800; letter-spacing:.2px; }
    .role{ opacity:.75; font-size:13px; margin-top:6px; }

    /* 正面以外を少し落とす */
    .card[data-state="side"]{
      opacity:.55;
      filter: blur(.2px) brightness(.85);
    }
    .card[data-state="back"]{
      opacity:.25;
      filter: blur(.4px) brightness(.7);
    }

    .controls{
      display:flex; gap:10px;
      padding:10px 12px;
      background: rgba(70,80,255,.10);
      border: 1px solid rgba(120,140,255,.25);
      border-radius: 999px;
      backdrop-filter: blur(10px);
    }
    button{
      appearance:none;
      border:none;
      padding:8px 12px;
      border-radius:999px;
      color:#e9ecff;
      background: rgba(120,140,255,.20);
      cursor:pointer;
      font-weight:700;
    }
    button:active{ transform: translateY(1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="stage">
      <div class="carousel" id="carousel">
        <article class="card" data-i="0">
          <div>
            <div class="avatar"><img src="https://picsum.photos/id/1005/200/200" alt=""></div>
            <div class="name">David</div><div class="role">Backend Dev</div>
          </div>
        </article>
        <article class="card" data-i="1">
          <div>
            <div class="avatar"><img src="https://picsum.photos/id/1011/200/200" alt=""></div>
            <div class="name">Sara</div><div class="role">Product Manager</div>
          </div>
        </article>
        <article class="card" data-i="2">
          <div>
            <div class="avatar"><img src="https://picsum.photos/id/1027/200/200" alt=""></div>
            <div class="name">Amir</div><div class="role">Frontend Dev</div>
          </div>
        </article>
        <article class="card" data-i="3">
          <div>
            <div class="avatar"><img src="https://picsum.photos/id/64/200/200" alt=""></div>
            <div class="name">Noah</div><div class="role">Designer</div>
          </div>
        </article>
        <article class="card" data-i="4">
          <div>
            <div class="avatar"><img src="https://picsum.photos/id/91/200/200" alt=""></div>
            <div class="name">Lina</div><div class="role">QA</div>
          </div>
        </article>
      </div>
    </div>

    <div class="controls">
      <button id="prev">◀ Prev</button>
      <button id="next">Next ▶</button>
    </div>
  </div>

  <script>
    const carousel = document.getElementById("carousel");
    const cards = Array.from(carousel.querySelectorAll(".card"));
    const n = cards.length;

    const radius = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--radius")) || 420;
    const step = 360 / n;

    // 各カードを円周に配置
    cards.forEach((card, i) => {
      card.style.transform = `rotateY(${i * step}deg) translateZ(${radius}px)`;
    });

    // 無限ループを“見た目も滑らか”にするため、
    // activeIndexとは別に回転角度を蓄積していく（最後→最初で角度がジャンプしない）
    let active = 0;
    let angle = 0; // 現在の親回転角（蓄積）

    function norm(i){ return (i % n + n) % n; }

    function renderStates(){
      cards.forEach((card, i) => {
        const d = Math.min(norm(i - active), norm(active - i));
        card.dataset.state = d === 0 ? "front" : (d === 1 ? "side" : "back");
      });
    }

    function apply(){
      carousel.style.transform = `rotateY(${angle}deg)`;
      renderStates();
    }

    function next(){
      active = norm(active + 1);
      angle -= step;   // 1枚分だけ同方向に回す
      apply();
    }

    function prev(){
      active = norm(active - 1);
      angle += step;   // 逆方向に1枚分
      apply();
    }

    document.getElementById("next").addEventListener("click", next);
    document.getElementById("prev").addEventListener("click", prev);

    // 初期表示
    apply();
  </script>
</body>
</html>
